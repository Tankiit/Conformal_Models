# Configuration for Conformal Concept Model on Shapes3D (CLEAR Audit Benchmark)
experiment_name: "clear_shapes3d_benchmark"
seed: 42

data:
  dataset: "shapes3d"
  num_samples: 2000
  image_size: 64
  num_concepts: 6
  num_classes: 4

model:
  backbone_type: "conv"
  latent_dim: 128
  hybrid_residual: false
  residual_dim: 16

training:
  epochs: 10
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  concept_loss_weight: 1.0
  task_loss_weight: 1.0
  device: null  # Auto-detects mps/cuda/cpu

conformal:
  score_type: "aps"  # "softmax", "aps", "raps", "margin"
  alpha: 0.10
  alphas_audit: [0.01, 0.05, 0.10, 0.20]
  fill_empty: true
  difficulty_mode: "concept_entropy"

interventions:
  max_budget: 5
  policies: ["random", "uncertainty", "greedy", "oracle"]

logging:
  save_dir: "checkpoints/shapes3d"
  vault_path: "vault"
  log_to_vault: true
